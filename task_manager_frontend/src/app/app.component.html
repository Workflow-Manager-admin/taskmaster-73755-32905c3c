<main class="tm-main">
  <section class="tm-task-manager">
    <header>
      <h1>Task Manager</h1>
    </header>
    <form class="tm-task-form" (ngSubmit)="addTask()" autocomplete="off">
      <input
        type="text"
        class="tm-input"
        [(ngModel)]="newTask"
        name="task"
        placeholder="Add a new task…"
        maxlength="100"
        autocomplete="off"
        required
      />
      <button class="tm-add-btn" type="submit" [disabled]="!newTask.trim()">Add</button>
    </form>
    <ul class="tm-task-list">
      <li *ngFor="let task of tasks; index as i" class="tm-task-item">
        <span class="tm-task-title">{{ task }}</span>
        <button
          class="tm-delete-btn"
          (click)="deleteTask(i)"
          title="Delete task"
          aria-label="Delete task"
          type="button"
        >&#x2715;</button>
      </li>
      <li *ngIf="tasks.length === 0" class="tm-empty">No tasks yet.</li>
    </ul>
  </section>
</main>
